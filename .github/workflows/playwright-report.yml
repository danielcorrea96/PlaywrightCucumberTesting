name: Test Report

on:
  workflow_run:
    workflows: ['CI - Playwright Tests']
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Download JUnit artifact
        uses: actions/download-artifact@v4
        with:
          name: junit-results

      - name: Publish test summary (JUnit)
        uses: dorny/test-reporter@v1
        with:
          artifact: junit-results
          name: Playwright Tests
          path: '*.xml'
          reporter: java-junit
          use-actions-summary: true
