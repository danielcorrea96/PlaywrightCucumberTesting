name: CI - Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee_automation
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('employee_automation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: run_tests
        run: npx playwright test --reporter=dot --reporter=html


      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: employee_automation/playwright-report

      - name: Write Actions summary
        if: always()
        run: |
          echo "## Playwright Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ steps.run_tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- HTML report artifact: playwright-report (download from Artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "- Logs: see the 'Run Playwright tests' step for details." >> $GITHUB_STEP_SUMMARY


      # Test summary is published by the separate `playwright-report` workflow
      # which runs after CI and processes the uploaded `junit-results` artifact.
